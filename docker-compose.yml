services:
  db:
    image: postgres:15-alpine
    container_name: medium_db
    restart: always
    environment:
      POSTGRES_USER: medium_user
      POSTGRES_PASSWORD: medium_password
      POSTGRES_DB: medium_clone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medium_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medium_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=medium_user
      - DB_PASSWORD=medium_password
      - DB_NAME=medium_clone
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8080
      - JWT_SECRET=super_secret_jwt_key_ubah_ini_di_productionqwertyuiopasdfghjkl0987654erfghjkbvczxcv0987654wdfghjnbfde34567uikjn
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medium_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
      - INTERNAL_API_URL=http://backend:8080/api
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
